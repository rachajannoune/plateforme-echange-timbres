services:
  postgres:
    image: postgres:17
    container_name: timbres-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: timbres-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0


    ports:
      - "5050:80"

    depends_on:
      - postgres
  nuxt:
    build:
      context: ./backend

    container_name: timbres-nuxt

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      - postgres

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend

    container_name: timbres-frontend

    ports:
      - "3001:3001"

    depends_on:
      - nuxt

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
    external: true
    name: plateforme-echange-timbres_postgres_data


